{% extends 'base.html' %}

{% block content %}
<div class="container" style="max-width: 600px;">
    <h2>Eliminar Gasto</h2>
    <p>¿Seguro querés eliminar el gasto: <strong>{{ expense.description }}</strong> por ${{ expense.amount }}?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sí, eliminar</button>
        <a href="{% url 'expenses:list' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
